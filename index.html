<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f4d">
  <meta name="description" content="SIAP-DPMD Kabupaten Tanah Laut">
  <title>SIAP-DPMD Kabupaten Tanah Laut</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #071832, #123c78, #087eaa);
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .emblem {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fff;
      color: #123c78;
      font-size: 30px;
      font-weight: 800;
    }

    h1 { margin: 0 0 10px; font-size: 30px; }

    p { color: #e2eaf7; line-height: 1.7; }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #f2c14e;
      color: #102345;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover { background: #ffda75; }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #cbd9ee;
    }
  </style>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbw9UJ2J6QQu0BtjSKBaqcR7yvEU-mpe8iJJf3IazeOLRDhewnOQRwT7nfzWW1egthly/exec";

    window.setTimeout(function () {
      window.location.replace(APP_URL);
    }, 1800);
  </script>
</head>

<body>
  <main class="container">
    <div class="emblem" aria-hidden="true">SD</div>

    <h1>SIAP-DPMD</h1>

    <p>
      Sistem Informasi dan Aktivitas Pegawai<br>
      Dinas Pemberdayaan Masyarakat dan Desa<br>
      Kabupaten Tanah Laut
    </p>

    <p>Anda sedang diarahkan ke aplikasi SIAP-DPMD.</p>

    <a class="button"
       href="https://script.google.com/macros/s/AKfycbw9UJ2J6QQu0BtjSKBaqcR7yvEU-mpe8iJJf3IazeOLRDhewnOQRwT7nfzWW1egthly/exec">
      Buka Aplikasi SIAP-DPMD
    </a>

    <div class="footer">
      Dinas Pemberdayaan Masyarakat dan Desa<br>
      Kabupaten Tanah Laut
    </div>
  </main>
</body>
</html>
